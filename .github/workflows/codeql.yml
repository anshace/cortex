name: codeql

# GitHub's free static security analysis (CodeQL) for public repos. Results show
# up under the Security → Code scanning tab. JS/TS needs no build step.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4.37.8
        with:
          language: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4.37.8
        with:
          category: "/language:${{ matrix.language }}"
