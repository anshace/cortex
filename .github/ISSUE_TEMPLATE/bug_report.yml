name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please **do not** include secrets, real
        passwords, or private data. For security issues, use the Security tab
        instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / image tag
      description: e.g. ghcr.io/anshace/cortex:latest, or a commit SHA
    validations:
      required: false
  - type: dropdown
    id: how-run
    attributes:
      label: How are you running Cortex?
      options:
        - Prebuilt image (docker run / docker compose)
        - Built from source (Docker)
        - Built from source (native)
        - Dev loop (docker-compose.dev.yml)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant container/browser-console output.
      render: shell
    validations:
      required: false
