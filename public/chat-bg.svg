<?xml version="1.0" encoding="UTF-8"?>
<!-- Custom minimal wallpaper: a calm blue gradient with soft glows and a few
     gentle wave bands — deliberately subtle so chat bubbles stay readable. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b4f8a"/>
      <stop offset="0.55" stop-color="#2569ab"/>
      <stop offset="1" stop-color="#3180c7"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8ec6ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8ec6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6fb3ec" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6fb3ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- Soft colour glows -->
  <ellipse cx="1120" cy="170" rx="520" ry="330" fill="url(#glow1)"/>
  <ellipse cx="240" cy="760" rx="460" ry="300" fill="url(#glow2)"/>

  <!-- Gentle wave bands (lower half) -->
  <path d="M0 660 Q 240 590 480 645 T 960 645 T 1440 650 L1440 900 L0 900 Z" fill="#a8d4ff" opacity="0.13"/>
  <path d="M0 730 Q 300 660 600 715 T 1200 715 T 1440 725 L1440 900 L0 900 Z" fill="#cfe9ff" opacity="0.1"/>

  <!-- Fine wave lines -->
  <path d="M0 520 Q 360 460 720 505 T 1440 495" stroke="#bfdcff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.3"/>
  <path d="M0 585 Q 300 630 600 575 T 1200 575 T 1440 585" stroke="#bfdcff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.22"/>
  <path d="M0 810 Q 400 770 800 810 T 1440 800" stroke="#e2f1ff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.18"/>
</svg>
