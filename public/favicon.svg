<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#201d36"/>
      <stop offset="1" stop-color="#0c0a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5b6ef5" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#5b6ef5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="strand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6ef5"/>
      <stop offset="1" stop-color="#8b7cf8"/>
    </linearGradient>
    <radialGradient id="node" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#f0ebff"/>
      <stop offset="1" stop-color="#b2a5f2"/>
    </radialGradient>
    <radialGradient id="core" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#a99cff"/>
      <stop offset="1" stop-color="#5a4ed6"/>
    </radialGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- Soft halo behind the network -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>
  <circle cx="32" cy="32" r="12" fill="none" stroke="#8b7cf8" stroke-opacity="0.22" stroke-width="1"/>

  <!-- 5 strands from the core to the outer nodes (pentagon) -->
  <g stroke="url(#strand)" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="32" x2="32" y2="14"/>
    <line x1="32" y1="32" x2="49" y2="26"/>
    <line x1="32" y1="32" x2="43" y2="47"/>
    <line x1="32" y1="32" x2="21" y2="47"/>
    <line x1="32" y1="32" x2="15" y2="26"/>
  </g>

  <!-- Outer nodes: dimensional orbs -->
  <g fill="url(#node)">
    <circle cx="32" cy="14" r="4.2"/>
    <circle cx="49" cy="26" r="4.2"/>
    <circle cx="43" cy="47" r="4.2"/>
    <circle cx="21" cy="47" r="4.2"/>
    <circle cx="15" cy="26" r="4.2"/>
  </g>

  <!-- Core node -->
  <circle cx="32" cy="32" r="7.5" fill="url(#core)"/>
</svg>
